name: HTML Publisher

on:
  workflow_run:
    workflows: [
      "Lotofacil",
      "SuperSete", 
      "MegaSena",
      "Quina",
      "+Milionaria"
    ]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    env:
      FAST_CI: '0'
      PYTHONUNBUFFERED: '1'
      
    steps:
      - name: 📊 Log trigger information
        run: |
          echo "🔍 **Workflow Trigger Information**"
          echo "Event Name: ${{ github.event_name }}"
          echo "Workflow Run ID: ${{ github.event.workflow_run.id }}"
          echo "Workflow Name: ${{ github.event.workflow_run.name }}"
          echo "Workflow Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"
      - name: ⏱️ Debounce de publicação (aguardar 30 segundos)
        run: |
          echo "⏱️ Aguardando 30 segundos para consolidar saídas das pipelines..."
          echo "📊 Workflow que disparou: ${{ github.event.workflow_run.name }}"
          sleep 30

      - name: Checkout repositório
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          echo "📦 Instalando dependências Python..."
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependências instaladas com sucesso!"

      - name: Verificar estrutura de arquivos
        run: |
          echo "📁 Verificando estrutura do projeto..."
          ls -la
          echo "📊 Verificando dados das loterias..."
          find Oraculo -name "*.csv" -exec wc -l {} + 2>/dev/null || echo "Arquivos CSV não encontrados"
          echo "🎯 Verificando predições mais recentes..."
          find Oraculo -name "prediction_*.json" | head -5 || echo "Predições não encontradas"

      - name: Gerar HTML unificado
        run: |
          echo "🌐 Gerando dashboard HTML..."
          python scripts/generate_html.py
          echo "🔍 Verificando presença dos cards de modelos..."
          if grep -q "modelos-container" index.html; then
            echo "✅ Cards de 'Modelos Individuais' presentes."
          else
            echo "⚠️ Cards não encontrados em index.html (verifique generate_html.py)."
          fi
          echo "✅ HTML gerado com sucesso!"

      - name: ⚖️ Verificar/criar pesos dos modelos
        continue-on-error: true
        run: |
          echo "⚖️ Verificando pesos dos modelos..."
          python scripts/quick_calibrate.py
          echo "✅ Pesos verificados/criados com sucesso!"

      - name: Validar arquivos gerados
        run: |
          echo "🔍 Validando arquivos gerados..."
          if [ -f "index.html" ]; then
            echo "✅ index.html encontrado ($(wc -c < index.html) bytes)"
          else
            echo "❌ index.html não foi gerado!"
            exit 1
          fi
          if [ -f "styles.css" ]; then
            echo "✅ styles.css encontrado ($(wc -c < styles.css) bytes)"
          else
            echo "⚠️ styles.css não encontrado"
          fi

      - name: Commit e push do HTML
        shell: bash
        run: |
          echo "📝 Configurando Git..."
          git config user.name "mzfshark"
          git config user.email "mzfshark@gmail.com"
          
          echo "🔄 Sincronizando com repositório remoto..."
          git pull --rebase || git pull
          
          echo "📁 Adicionando arquivos..."
          # Adiciona HTML/CSS sempre
          git add index.html styles.css
          
          # Adiciona pesos auto-calibrados caso existam
          if compgen -G "Oraculo/*/models/weights.auto.json" > /dev/null; then
            echo "⚖️ Adicionando pesos auto-calibrados..."
            git add Oraculo/*/models/weights.auto.json
          fi
          
          # Adiciona README.md se foi modificado
          git add README.md 2>/dev/null || true
          
          echo "🔍 Verificando alterações..."
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "🎯 Atualiza dashboard das loterias - $TIMESTAMP

            - 📊 Dashboard HTML atualizado
            - 🎮 Predições mais recentes incluídas
            - 📈 Gráficos interativos atualizados
            - ⚙️ Gerado automaticamente via GitHub Actions"
            echo "📤 Fazendo push das alterações..."
            git push
            echo "✅ Alterações commitadas e enviadas!"
          else
            echo "ℹ️ Nenhuma alteração detectada. Nada para comitar."
          fi

      - name: 📦 Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true
          user_name: 'mzfshark'
          user_email: 'mzfshark@gmail.com'
          commit_message: |
            � Dashboard atualizado - $(date '+%Y-%m-%d %H:%M UTC')
            
            🤖 Atualização automática via GitHub Actions
            📈 Predições e análises atualizadas
            🔄 Commit: ${{ github.sha }}

      - name: 🎯 Prepare for Pages deployment
        run: |
          echo "✅ Files published to gh-pages branch"
          echo "🔄 Pages deployment will be triggered automatically"
          echo "📊 Dashboard will be available at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: 📊 Workflow Summary
        run: |
          echo "🎉 **HTML Publisher executado com sucesso!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Tarefas Concluídas:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Dashboard HTML gerado" >> $GITHUB_STEP_SUMMARY
          echo "- ⚖️ Pesos dos modelos verificados" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Arquivos publicados no gh-pages" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 Deploy para GitHub Pages iniciado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Próximos Passos:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Deploy Pages será executado automaticamente" >> $GITHUB_STEP_SUMMARY
          echo "2. Dashboard estará disponível em ~2-3 minutos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Executado em:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
