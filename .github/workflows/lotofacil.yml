name: Lotofacil Auto Predict

on:
  push:
    paths:
      - 'Oraculo/Lotofacil/data/Lotofacil.csv'
  schedule:
    - cron: '0 12 * * *' # Executa diariamente às 9h BRT (12h UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predict-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install pandas numpy seaborn matplotlib tabulate plotly markdown2 jinja2 scipy requests beautifulsoup4 lxml

      - name: Baixar resultados oficiais (xlsx -> csv)
        run: |
          python scripts/fetch_results.py --game lotofacil

      - name: Executar pipeline completa
        run: |
          python Oraculo/Lotofacil/scripts/predict.py

      - name: Executar benchmark
        run: |
          python Oraculo/Lotofacil/scripts/benchmark.py

      - name: Commit e push dos resultados
        run: |
          git config user.name "mzfshark"
          git config user.email "mzfshark@gmail.com"
          git pull
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza previsões e relatório da Lotofácil"
            for i in 1 2 3; do
              if git push; then
                break
              else
                echo "Push falhou (tentativa $i). Rebaseando e tentando novamente...";
                git pull --rebase || true
                sleep 2
              fi
            done
          else
            echo "Nenhuma mudança para comitar."
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

