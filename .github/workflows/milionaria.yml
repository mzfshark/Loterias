name: +Milionaria Auto Predict

on:
  push:
    paths:
      - 'Oraculo/Milionaria/data/Milionaria.csv'
  schedule:
    - cron: '0 12 * * *' # Executa diariamente às 9h BRT (12h UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predict-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install pandas numpy seaborn matplotlib tabulate plotly markdown2 jinja2 scipy scikit-learn requests beautifulsoup4 lxml
      - name: Sincronizar resultados oficiais (API -> CSV)
        run: |
          python scripts/fetch_results.py --game milionaria --mode api || true


      - name: Executar pipeline completa (FAST_CI)
        env:
          FAST_CI: "1"
        run: |
          set -euo pipefail
          echo "Iniciando predição +Milionária..."
          python -u Oraculo/Milionaria/scripts/predict.py || { echo "Predição falhou"; exit 1; }
          echo "+Milionária concluída."

      - name: Gerar HTML unificado
        run: |
          echo "HTML unificado será gerado pelo workflow Publisher."

      - name: Executar benchmark (FAST_CI)
        env:
          FAST_CI: "1"
        run: |
          set -euo pipefail
          echo "Iniciando benchmark +Milionária..."
          python -u Oraculo/Milionaria/scripts/benchmark.py || { echo "Benchmark falhou"; exit 1; }
          echo "Benchmark +Milionária concluído."

      - name: Commit e push dos resultados
        run: |
          git config user.name "mzfshark"
          git config user.email "mzfshark@gmail.com"
          git pull
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza previsões e relatório da +Milionária"
            for i in 1 2 3; do
              if git push; then
                break
              else
                echo "Push falhou (tentativa $i). Rebaseando e tentando novamente...";
                git pull --rebase || true
                sleep 2
              fi
            done
          else
            echo "Nenhuma mudança para comitar."
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      # Publicação centralizada no workflow Publisher
